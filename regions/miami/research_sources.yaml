official_sources:
  flood:
    - name: "FEMA Flood Map Service Center"
      url: "https://msc.fema.gov/portal/home"
      method: "web"
      use: "Address-level official flood map lookup."
    - name: "FEMA National Flood Hazard Layer"
      url: "https://www.fema.gov/flood-maps/national-flood-hazard-layer"
      method: "web_or_gis_service"
      use: "GIS flood hazard layer for flood-zone context."
    - name: "Miami-Dade Storm Surge Planning Zones"
      url: "https://www.miamidade.gov/global/emergency/hurricane/storm-surge-zones.page"
      method: "web_or_gis"
      use: "Local storm surge planning zone and evacuation context."
    - name: "NOAA Sea Level Rise Viewer"
      url: "https://coast.noaa.gov/slr/"
      method: "web_or_data_download"
      use: "Screening-level sea-level-rise and coastal-flooding exposure."
    - name: "NOAA Tides and Currents"
      url: "https://tidesandcurrents.noaa.gov/"
      method: "web_or_api"
      use: "Tides, water levels, high-tide flooding outlooks, and coastal conditions."
