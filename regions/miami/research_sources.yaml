listing_sources:
  - name: "Zillow Rentals"
    url: "https://www.zillow.com/homes/for_rent/"
    method: "web"
    caveat: "No reliable public rental inventory API; listings can be stale or incomplete."
  - name: "Apartments.com"
    url: "https://www.apartments.com/"
    method: "web"
    caveat: "Use for availability, pricing, fees, and reviews, but verify with building."
  - name: "Redfin Rentals"
    url: "https://www.redfin.com/rentals"
    method: "web"
    caveat: "Redfin says availability is not guaranteed; verify with property manager."
  - name: "Realtor.com Rentals"
    url: "https://www.realtor.com/apartments/Miami_FL"
    method: "web"
    caveat: "Use for cross-checking condo and apartment listings."
  - name: "RentCafe"
    url: "https://www.rentcafe.com/"
    method: "web"
    caveat: "Useful for managed apartment communities."

